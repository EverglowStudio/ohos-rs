[package]
name = "napi-ohos-uniffi-engine"
version = "0.1.0"
description = "Programmatic OHOS Ark N-API engine for UniFFI JavaScript bridge plans"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EverglowStudio/ohos-rs"
rust-version.workspace = true

[dependencies]
napi-ohos = { path = "../napi", version = "=1.2.0", default-features = false, features = ["napi8", "tokio_rt"] }
napi-family-core = { git = "https://github.com/EverglowStudio/napi-rs.git", rev = "54e9658a75013e827a22e1390dadef3ebd8b44d3", version = "=0.1.0" }
napi-derive-backend-ohos = { path = "../backend", version = "=1.2.0" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
futures = "0.3"

[lints]
workspace = true
